# Continuous integration for Placeable Plants — runs on every push and pull
# request to validate the multi-version source tree built via Stonecutter.
#
# `chiseledBuild` is the single CI entry point, exercising every supported
# Minecraft version (1.21.1, 1.21.4, 1.21.5, 1.21.8, 1.21.11) from one source
# tree. The workflow also runs the JUnit suites for every supported version
# explicitly so a regression in any line cannot silently mask passing tests
# on the others.

name: build

# Trigger on every branch push and every PR. Tag pushes (`v*`) are filtered
# out of the push trigger so the release workflow owns publishing —
# otherwise a tagged commit would build twice.
on:
    push:
        branches: [ "**" ]
        tags-ignore: [ "v*" ]
    pull_request:

# Cancel in-flight runs on the same ref to keep CI minutes proportional to
# active development rather than "every push for the last hour".
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: chiseledBuild + tests
        runs-on: ubuntu-latest

        permissions:
            # Read-only token — the build job has no business mutating the
            # repo. The release workflow widens these as needed via its own
            # permission block.
            contents: read

        steps:
            # Step 1 — Pull the source. Submodules are explicitly disabled
            # because this repo has none; declaring it makes the assumption
            # explicit so an accidental future submodule does not silently
            # change CI behaviour.
            -   name: Checkout sources
                uses: actions/checkout@v4
                with:
                    submodules: false

            # Step 2 — Provision Java 21 (Temurin). All five supported MC
            # versions (1.21.1 – 1.21.11) target Java 21; Java 25 is reserved
            # for the future 26.x lifecycle phase.
            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: "21"

            # Step 3 — Cache the Gradle user home so subsequent runs reuse the
            # Loom asset/library downloads (Minecraft jars, Yarn, Fabric API,
            # Cloth Config, ModMenu) instead of re-fetching ~600 MB on every
            # push.
            #
            # Cache key is keyed on:
            #   - Gradle wrapper SHA (so a wrapper bump invalidates the cache
            #     cleanly).
            #   - libs.versions.toml + every per-version gradle.properties
            #     (the actual coordinate set Loom resolves). This is more
            #     precise than a raw hash of build.gradle.kts and avoids
            #     stale caches when only Kotlin code in the build script
            #     changed.
            -   name: Cache Gradle dependencies
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('gradle/libs.versions.toml', 'versions/*/gradle.properties') }}
                    restore-keys: |
                        gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

            # Step 4 — `./gradlew` ships with Unix line endings and the
            # execute bit via .gitattributes, but `chmod +x` is cheap
            # insurance against a future Windows-authored commit silently
            # dropping the bit.
            -   name: Make gradlew executable
                run: chmod +x ./gradlew

            # Step 5 — The single CI entry point: build every Stonecutter
            # target. `chiseledBuild` (declared in stonecutter.gradle.kts)
            # depends on each subproject's `build` task, which itself depends
            # on `test`. The Gradle daemon stays warm between subprojects, so
            # cumulative time is dominated by Loom's per-version remap step
            # rather than JVM startup.
            -   name: Build all versions (chiseledBuild)
                run: ./gradlew chiseledBuild --stacktrace

            # Step 6 — Explicitly re-run the JUnit suite for every supported
            # version. `chiseledBuild` already triggers `test` transitively,
            # but invoking these tasks by name ensures any regression in the
            # test-runner wiring surfaces as a failed CI step with a clear
            # name rather than an opaque "chiseledBuild" failure.
            -   name: Run unit tests on every supported version
                run: ./gradlew :1.21.1:test :1.21.4:test :1.21.5:test :1.21.8:test :1.21.11:test --stacktrace

            # Step 7 — Publish every produced jar as a workflow artifact so
            # reviewers can download the exact build CI verified. Path
            # matches Stonecutter's subproject layout: each
            # `versions/<mc>/build/libs/` holds both the remapped runtime
            # jar and (when configured) the sources jar.
            -   name: Upload built jars
                uses: actions/upload-artifact@v4
                with:
                    name: placeable-plants-jars
                    path: versions/*/build/libs/*.jar
                    if-no-files-found: error
                    retention-days: 14
