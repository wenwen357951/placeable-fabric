# Per-version overrides for Minecraft 1.21.11.
#
# 1.21.11 is the final 1.21 series release. No plant-related API drift
# relative to 1.21.5 / 1.21.8; expected to compile cleanly.
#
# Note: 1.21.11 marks the boundary before the 26.x ecosystem break (Mojmap,
# Java 25, new Loom plugin ID). 26.x support is a separate project lifecycle —
# do NOT attempt to add 26.1 here.
minecraft=1.21.11
yarn_mappings=1.21.11+build.5
fabric_loader=0.17.2
fabric_api=0.141.3+1.21.11
cloth_config=21.11.153
modmenu=17.0.0
