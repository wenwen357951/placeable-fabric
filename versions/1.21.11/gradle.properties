# jar serves the tail of the 1.21 series (1.21.9 "Copper Age" through 1.21.11
# "Mounts of Mayhem"). The `<1.22` ceiling enforces the project-lifecycle
# boundary — 26.x ecosystem is a separate project lifecycle.
# See docs/VERSIONS.md.
minecraft_dep=>=1.21.9- <1.22
