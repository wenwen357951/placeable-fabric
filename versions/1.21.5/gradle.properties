# Per-version overrides for Minecraft 1.21.5 — the active baseline version.
#
# 1.21.5 introduces SHORT_DRY_GRASS, TALL_DRY_GRASS, CACTUS_FLOWER and renames
# `BambooSaplingBlock` to `BambooShootBlock`. The mixin source tree currently
# targets these new names — adaptation for older versions is handled by
# `//? if` Stonecutter conditionals.
minecraft=1.21.5
yarn_mappings=1.21.5+build.1
fabric_loader=0.17.2
fabric_api=0.128.2+1.21.5
cloth_config=18.0.145
modmenu=14.0.0-rc.2
# Per-build Minecraft dependency range exposed to fabric.mod.json. The 1.21.5
# jar serves ONLY 1.21.5 — the source tree references Blocks.SHORT_DRY_GRASS /
# TALL_DRY_GRASS / BUSH / FIREFLY_BUSH / WILDFLOWERS / CACTUS_FLOWER, which DO
# NOT exist in 1.21.4's vanilla Blocks class. Loading this jar on 1.21.4 would
# throw NoSuchFieldError when PlaceablePlants.<clinit> runs. The dedicated
# 1.21.4 build target (versions/1.21.4/) covers that patch by stripping those
# entries via Stonecutter `//? if >=1.21.5` guards. See docs/VERSIONS.md
# "Per-version compatibility map".
minecraft_dep=>=1.21.5- <1.21.6
