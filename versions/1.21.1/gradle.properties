# Per-version overrides for Minecraft 1.21.1.
#
# Stonecutter merges this file into the project properties of the chiseled
# subproject before `build.gradle.kts` is evaluated, so every coordinate below
# becomes accessible via `property("...")` inside that script.
#
# Sources for these versions:
#   - yarn_mappings : meta.fabricmc.net/v2/versions/yarn/1.21.1
#   - fabric_api   : Modrinth project `fabric-api` filtered by game_version=1.21.1
#   - cloth_config : Modrinth project `cloth-config` filtered by game_version=1.21.1
#   - modmenu      : Modrinth project `modmenu` filtered by game_version=1.21.1
#
# 1.21.1 predates several blocks the mod ships mixins for (BUSH, FIREFLY_BUSH,
# PALE_OAK_SAPLING, SHORT_DRY_GRASS, TALL_DRY_GRASS, CACTUS_FLOWER) and uses the
# old `BambooSaplingBlock` class name. Source-level adaptation is handled by
# `//? if` Stonecutter conditionals in the source tree — this file only
# supplies correct dependency coordinates.
minecraft=1.21.1
yarn_mappings=1.21.1+build.3
fabric_loader=0.17.2
# Cloth Config 15.x is the last line that targets 1.21.1.
fabric_api=0.116.11+1.21.1
cloth_config=15.0.140
modmenu=11.0.4
# Per-build Minecraft dependency range exposed to fabric.mod.json. The 1.21.1
# jar serves the Tricky Trials drop (1.21 + 1.21.1) — declaring `<1.21.4` is a
# defensive ceiling that makes Fabric Loader refuse to load this jar on the
# next drop's patch versions, where players should pick the 1.21.5 jar
# instead. See docs/VERSIONS.md "Per-version compatibility map".
minecraft_dep=>=1.21- <1.21.4
