# Per-version overrides for Minecraft 1.21.4 ("Bundles of Bravery").
#
# Stonecutter merges this file into the project properties of the chiseled
# subproject before `build.gradle.kts` is evaluated, so every coordinate below
# becomes accessible via `property("...")` inside that script.
#
# Why a dedicated 1.21.4 build target?
#   The 1.21.5 ("Spring to Life") source tree references vanilla Block constants
#   added in 1.21.5: BUSH, FIREFLY_BUSH, SHORT_DRY_GRASS, TALL_DRY_GRASS,
#   CACTUS_FLOWER, WILDFLOWERS. Running the 1.21.5 jar on a 1.21.4 server
#   would throw NoSuchFieldError when PlaceablePlants.<clinit> resolves those
#   static fields against 1.21.4's Blocks class. A separate build target lets
#   Stonecutter strip those entries via `//? if >=1.21.5` for the 1.21.4 jar
#   while keeping PALE_OAK_SAPLING / CLOSED_EYEBLOSSOM / OPEN_EYEBLOSSOM
#   (which DO exist in 1.21.4 — they shipped in Bundles of Bravery).
#
# Sources for these coordinates:
#   - yarn_mappings : meta.fabricmc.net/v2/versions/yarn/1.21.4 → latest build.8
#   - fabric_api   : Modrinth project `fabric-api` filtered by game_version=1.21.4
#                    → 0.119.4+1.21.4 (latest in the 0.119.x line for 1.21.4)
#   - cloth_config : Modrinth project `cloth-config` filtered by game_version=1.21.4
#                    → 17.0.144+fabric. Maven coord drops the `+fabric` suffix
#                      to match the layout used by neighbouring versions
#                      (1.21.5 uses 18.0.145, 1.21.1 uses 15.0.140).
#   - modmenu      : Modrinth project `modmenu` filtered by game_version=1.21.4
#                    → 13.0.4 (latest 13.x line that targets 1.21.4)
#   - fabric_loader: 0.17.2 — same as every other supported target; loader is
#                    backward-compatible across the entire 1.21.x series.
minecraft=1.21.4
yarn_mappings=1.21.4+build.8
fabric_loader=0.17.2
fabric_api=0.119.4+1.21.4
cloth_config=17.0.144
modmenu=13.0.4
# Per-build Minecraft dependency range exposed to fabric.mod.json. The 1.21.4
# jar serves ONLY 1.21.4 — the predecessor patch (1.21.3) lacks PALE_OAK_SAPLING
# and the EYEBLOSSOM variants, while the successor (1.21.5) adds BUSH /
# FIREFLY_BUSH / SHORT_DRY_GRASS / TALL_DRY_GRASS / CACTUS_FLOWER / WILDFLOWERS.
# A tight `>=1.21.4- <1.21.5` window lets Fabric Loader reject the wrong
# patch automatically and steer players to the correct jar.
# See docs/VERSIONS.md "Per-version compatibility map".
minecraft_dep=>=1.21.4- <1.21.5
