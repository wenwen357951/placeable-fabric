# Root gradle.properties — values shared by every Stonecutter target.
#
# Anything that varies per Minecraft version (minecraft, yarn_mappings,
# fabric_loader, fabric_api, cloth_config, modmenu) lives in
# versions/<mc>/gradle.properties instead. Stonecutter merges the per-version
# file into the project properties for each chiseled subproject before
# build.gradle.kts runs.
# JVM heap — Loom + Mixin annotation processing is memory-hungry, especially
# when building all five MC targets back-to-back via chiseledBuild.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Mod identity — invariant across all MC versions.
maven_group=com.wennest
mod_version=1.3.0-alpha.2
archives_base_name=placeable-plants
