# DO NOT add per-MC coordinates here. See versions/<mc>/gradle.properties for
# the multi-version build system.
#
# This catalog now holds ONLY:
#   - the Fabric Loom plugin (version-agnostic — applies the same way across
#     every Stonecutter subproject), and
#   - truly version-agnostic libraries (gson, lombok) that do not vary across
#     the supported MC family.
#
# Every other dependency (minecraft / yarn_mappings / fabric_loader /
# fabric_api / cloth_config / modmenu) is resolved per-MC from
# versions/<mc>/gradle.properties inside build.gradle.kts via `property("...")`
# lookups.

[versions]
# Build plugin — version-agnostic.
fabric-loom = "1.16.1"

# Library — version-agnostic across the 1.21.x family.
gson = "2.13.1"
lombok = "1.18.38"


[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }


[libraries]
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
